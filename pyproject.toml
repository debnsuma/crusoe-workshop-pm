[project]
name = "crusoe-chat"
version = "1.0.0"
description = "A small chatbot on Crusoe Managed Inference"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai>=1.99",
    "python-dotenv>=1.0",
    "gradio>=5.9",
    "jupyterlab>=4.2",
    "ipywidgets>=8.1",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "langchain-openai>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The notebook introduces imports where they are first used, on purpose.
"notebook.ipynb" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real Crusoe API, needs CRUSOE_API_KEY"]
addopts = "-q"
