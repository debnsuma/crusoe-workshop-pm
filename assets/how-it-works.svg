<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img"
     aria-label="How it works. Your question plus the conversation so far and any attached documents are assembled into a list of messages, sent over the OpenAI-compatible API to Crusoe, and the answer streams back and is appended to the conversation, which is saved to a JSON file on your machine.">
  <rect width="1000" height="300" fill="#FFFFFF"/>
  <g font-family="'Roboto Mono','Diatype Mono',ui-monospace,monospace">

    <rect x="24" y="14" width="78" height="22" fill="#CEEB13"/>
    <text x="34" y="30" fill="#000000" font-size="11" letter-spacing="2">CRUSOE</text>
    <text x="24" y="62" fill="#000000" font-size="17">What happens when you press Return</text>

    <!-- 1 you -->
    <rect x="24" y="92" width="196" height="138" fill="#FFFFFF" stroke="#E4E2E0" stroke-width="2"/>
    <rect x="24" y="92" width="196" height="26" fill="#395761"/>
    <text x="36" y="110" fill="#FFFFFF" font-size="11" letter-spacing="1.5">1. YOU</text>
    <text x="36" y="140" fill="#000000" font-size="12">your question</text>
    <text x="36" y="162" fill="#000000" font-size="12">the chat so far</text>
    <text x="36" y="184" fill="#000000" font-size="12">any dropped files</text>
    <text x="36" y="212" fill="#4A4A4A" font-size="10.5">memory.build_messages()</text>

    <line x1="230" y1="161" x2="296" y2="161" stroke="#000000" stroke-width="2"/>
    <path d="M296 161 L285 155 L285 167 Z" fill="#000000"/>

    <!-- 2 messages -->
    <rect x="306" y="92" width="196" height="138" fill="#FAFAFA" stroke="#E4E2E0" stroke-width="2"/>
    <rect x="306" y="92" width="196" height="26" fill="#CEEB13"/>
    <text x="318" y="110" fill="#000000" font-size="11" letter-spacing="1.5">2. ONE LIST</text>
    <text x="318" y="138" fill="#000000" font-size="11">[{"role":"system"},</text>
    <text x="318" y="158" fill="#000000" font-size="11"> {"role":"user"},</text>
    <text x="318" y="178" fill="#000000" font-size="11"> {"role":"assistant"},</text>
    <text x="318" y="198" fill="#000000" font-size="11"> {"role":"user"}]</text>
    <text x="318" y="220" fill="#4A4A4A" font-size="10.5">plain Python, no framework</text>

    <line x1="512" y1="161" x2="578" y2="161" stroke="#000000" stroke-width="2"/>
    <path d="M578 161 L567 155 L567 167 Z" fill="#000000"/>

    <!-- 3 crusoe -->
    <rect x="588" y="92" width="196" height="138" fill="#FFFFFF" stroke="#CEEB13" stroke-width="3"/>
    <rect x="588" y="92" width="196" height="26" fill="#000000"/>
    <text x="600" y="110" fill="#FFFFFF" font-size="11" letter-spacing="1.5">3. CRUSOE</text>
    <text x="600" y="140" fill="#000000" font-size="12">open-weight model</text>
    <text x="600" y="162" fill="#000000" font-size="12">answer streams back</text>
    <text x="600" y="192" fill="#4A4A4A" font-size="10.5">api.inference</text>
    <text x="600" y="208" fill="#4A4A4A" font-size="10.5">.crusoecloud.com/v1</text>
    <text x="600" y="224" fill="#4A4A4A" font-size="10.5">client.stream()</text>

    <line x1="794" y1="161" x2="860" y2="161" stroke="#000000" stroke-width="2"/>
    <path d="M860 161 L849 155 L849 167 Z" fill="#000000"/>

    <!-- 4 saved -->
    <rect x="870" y="92" width="106" height="138" fill="#FFFFFF" stroke="#E4E2E0" stroke-width="2"/>
    <rect x="870" y="92" width="106" height="26" fill="#99AE88"/>
    <text x="880" y="110" fill="#000000" font-size="11" letter-spacing="1.5">4. SAVED</text>
    <text x="880" y="140" fill="#000000" font-size="11">sessions/</text>
    <text x="880" y="160" fill="#000000" font-size="11">*.json</text>
    <text x="880" y="188" fill="#4A4A4A" font-size="10.5">on your</text>
    <text x="880" y="204" fill="#4A4A4A" font-size="10.5">machine</text>

    <text x="24" y="268" fill="#4A4A4A" font-size="11">The API is stateless. It remembers nothing. "Memory" is just sending the earlier turns back every time, which is why step 2 is the whole trick.</text>
  </g>
</svg>
